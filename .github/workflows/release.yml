name: Prepare Windows release (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci
          npm --prefix client ci
      - name: Test
        run: npm test
      - name: Build client
        run: npm --prefix client run build
      - name: Build unsigned installer
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: sellquanta-candidate-${{ github.sha }}
          path: |
            release/*.exe
            release/*.blockmap
          retention-days: 14
# Preparation only: no tag triggers, write token, release publication or website deployment.
# Sign metadata for the exact approved installer using tools/prepareRelease.mjs after validation.
